name: Atualizador Automatico de Leads

on:
  schedule:
    # Roda automaticamente todo dia 1º de cada mês às 03:00 da manhã
    - cron: '0 3 1 * *'
  workflow_dispatch: # Permite disparar manualmente com 1 clique no GitHub

jobs:
  minerar_e_atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Executar Mineração e Enviar para o Supabase
        env:
          SUPABASE_URL: 'https://ogtuawhwjbzrtkwnvlyp.supabase.co'
          SUPABASE_KEY: 'sb_publishable_s7sJ40oQI5LybX7N-VrZGQ_mnYXRPLM'
        run: |
          python api/auto_miner.py
