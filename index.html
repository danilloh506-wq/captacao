<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor de Leads - Consórcio</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SDK Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Motor de Leads - Alto Padrão</h1>
            <p>Extração e Qualificação para Cartas de Crédito (> R$ 500k)</p>
        </header>

        <main class="card">
            <div class="form-group">
                <label for="cnae">Segmento (Perfil do Lead)</label>
                <select id="cnae">
                    <option value="8630501">Médicos & Clínicas</option>
                    <option value="4120400">Construtoras & Incorporadoras</option>
                    <option value="6911701">Advogados & Escritórios</option>
                    <option value="6462000">Holdings & Investidores</option>
                    <option value="0111301">Agronegócio</option>
                </select>
            </div>

            <div class="form-group">
                <label for="regiao">Localização (Filtro por m² mais caro)</label>
                <select id="regiao">
                    <option value="todas">🇧🇷 Brasil inteiro (Top 50 Bairros Nobres)</option>
                    <option value="sp">São Paulo (Itaim Bibi, Jardins, Moema, Pinheiros)</option>
                    <option value="rj">Rio de Janeiro (Leblon, Ipanema, Barra da Tijuca)</option>
                    <option value="sul">Sul (Balneário Camboriú, Batel - Curitiba, Florianópolis)</option>
                    <option value="outras">Demais Capitais (BH - Lourdes/Savassi, Brasília - Sudoeste)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="capital">Capital Social Mínimo (R$)</label>
                <input type="text" id="capital" value="500.000,00">
            </div>

            <button id="btn-buscar" class="btn-primary">Buscar e Exportar CSV</button>
            
            <button id="btn-sync" class="btn-secondary" style="margin-top: 10px; width: 100%; background-color: #4b5563; color: white; padding: 0.75rem; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; font-family: 'Inter', sans-serif;">
                🔄 Atualizar Base de Dados (Nuvem)
            </button>

            <div id="status" class="status"></div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
